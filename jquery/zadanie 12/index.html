<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strona jquery</title>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" 
    crossorigin="anonymous">
    </script>
    <script>
        $(function(){
            $("#kolor").change(function(){
                $("body").css("background-color",$(this).val())
            })
            $("#rozmiar").each(function(){
                $("#p1").text("Do zapłaty "+$(this).val())
            })
            $("#newsletter").change(function(){
                if($(this).is(":checked")){
                    $("#stan").text("Zapisano do newslettera")
                }else{
                    $("#stan").text("wypisano z newslettera")
                }
            })
            $("#regulamin").change(function(){
                if($(this).is(":checked")){
                    $("#rejestracja").prop("disabled",false);
                }else{
                    $("#rejestracja").prop("disabled",true)
                }

                //dodatkowe
                $("#rejestracja").prop("disabled",!$(this).is(":checked"))
            })

            $("#tekst").on("input",function(){
                $("#podglad").text($(this).val())
            })

            $("#tekstarea").on("input",function(){
                let charLeft = 100 - $(this).val().length;
                $("#licznik").text(charLeft)

                if(charLeft < 10){
                    $("#licznik").css("color","red")
                }else{
                    $("#licznik").css("color","black")
                }
            })
        });
    </script>
    <style>
      
    </style>
</head>
<body>
    <select id="kolor">
        <option value="white">Biały</option>
        <option value="yellow">Żółty</option>
        <option value="lightblue">Niebieski</option>
    </select>
    <hr>
    <!-- zadanie z selectem -->
     <hr>
     <select id="rozmiar">
        <option  value="20zł">Mała</option>
        <option  value="30zł">Średnia</option>
        <option  value="40zł">Duża</option>
     </select>
     <p id="p1"></p>
     <hr>
     <input type="checkbox" id="newsletter">
     <p id="stan"></p>
     <hr>
     <input type="checkbox" id="regulamin">
     <label for="regulamin">Akceptuje regulamin</label>
     <button id="rejestracja" disabled>Zarejestruj</button>
     <hr>
     <input type="text" id="tekst">
     <p>Podgląd: <span id="podglad"></span></p>
     <hr>
     <textarea id="tekstarea" maxlength="100"></textarea>
     <p id="licznik">Pozostało znaków: </p>
</body>
</html>
