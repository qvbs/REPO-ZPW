<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strona jquery</title>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" 
    crossorigin="anonymous">
    </script>
    <script>
        $(function(){
            $("#formularz").submit(function(e){
                e.preventDefault();
                if($("#nick").val() === ""){
                    $("#info").text("podaj nick!")
                }else{
                    $("#info").text("przesłano nick: " + $("#nick").val())
                }
            })
            $("#login").submit(function(e){
            e.preventDefault(); 
            if($("#haslo").val().length < 6){
                $("#infohaslo").text("Hasło jest za krótkie").css("color", "red");
                    } else {
                $("#infohaslo").text("Zalogowano").css("color", "green");
                }
            });
        });                                  
            
    </script>
    <style>
      
    </style>
</head>
<body>
    <form id="formularz">
        <input type="text" id="nick">
        <button type="submit">Wyslij</button>
    </form>
    <p id="info"></p>
    <hr>
    <form id="login">
        <label for="email">E-mail</label>
        <input type="text" id="Email"><br>
        <label for="password">Haslo</label>
        <input type="password" id="haslo">
        <button type="submit">Sprawdz</button>
        <p id="infohaslo"></p>
    </form>
</body>
</html>
